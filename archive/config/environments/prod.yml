# Production Environment Configuration  
database: "ANALYTICS"
schema: "CORTEX_APPS"
app_name: "CORTEX_AI_COST_ANALYZER"
warehouse: "COMPUTE_WH"

# Performance settings for production
query_timeout: 30
cache_ttl: 300  # 5 minutes

# Production settings
debug: false
log_level: "INFO"

# Data freshness thresholds (strict for prod)
freshness_warning_hours: 3
freshness_critical_hours: 6

# Reconciliation accuracy thresholds
variance_excellent: 1.0
variance_good: 2.0
variance_warning: 5.0