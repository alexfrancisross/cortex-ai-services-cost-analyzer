# Cortex AI Services Cost Analyzer - Monorepo Configuration
# This file defines the structure and configuration for the monorepo

name: "cortex-ai-cost-analyzer-monorepo"
version: "1.0.0"
description: "Comprehensive Snowflake Cortex AI Services cost analysis and monitoring platform"

# Application definitions
applications:
  cortex-cost-analyzer:
    path: "apps/cortex-cost-analyzer"
    type: "streamlit"
    description: "Main Streamlit application for cost analysis"
    dependencies:
      - "libs/cortex-analytics"

# Shared libraries
libraries:
  cortex-analytics:
    path: "libs/cortex-analytics"
    type: "python-package"
    description: "Shared analytics components and utilities"
    
# Environment configurations
environments:
  development:
    config: "config/environments/dev.yml"
    database_suffix: "_DEV"
  
  production:
    config: "config/environments/prod.yml" 
    database_suffix: ""

# Build and deployment
build:
  artifacts_dir: "dist"
  test_dir: "tests"
  docs_dir: "docs"

# Scripts and automation  
scripts:
  deploy: "scripts/deploy.sh"
  validate: "scripts/validate.sql"
  test: "python -m pytest tests/"