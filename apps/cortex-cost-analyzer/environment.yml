# Streamlit in Snowflake Environment Configuration
# Based on Snowflake Labs examples: https://github.com/Snowflake-Labs/snowflake-demo-streamlit

name: cortex_analyzer_env
channels:
  - snowflake
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pandas
  - numpy
  - plotly
  - streamlit
  - requests
