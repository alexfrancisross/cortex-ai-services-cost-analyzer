# Snowflake CLI Project Configuration
# Cortex AI Services Cost Analyzer
# Following official Snowflake CLI v2 format from:
# https://docs.snowflake.com/en/developer-guide/snowflake-cli/streamlit-apps/manage-apps/initialize-app

definition_version: 2

entities:
  cortex_cost_analyzer:
    type: streamlit
    identifier: 
      name: "CORTEX_AI_COST_ANALYZER"
      schema: "CORTEX_APPS"
      database: "ANALYTICS"
    stage: "CORTEX_ANALYZER_STAGE"
    query_warehouse: "COMPUTE_WH"
    main_file: "app.py"
    title: "Cortex AI Services Cost Analyzer"
    comment: "Production-ready cost analysis and reconciliation for Snowflake Cortex AI Services"
    artifacts:
      - "app.py"
      - "data_layer.py"
      - "reconciliation.py"
      - "visualizations.py"
      - "utils.py"
      - "environment.yml"
